<div class="container">
    <h2>Projetos desenvolvidos</h2>
    <ul>
        @for(item of arrayProjets(); track item){
        <li>
           <button (click) ="openDialog(item)">
            <img 
            [src]='item.src' 
            [alt]='item.alt'
            [attr.witdh]='item.width'
            [attr.height] = 'item.height'
            loading="lazy">
           </button> 
        </li>
    }
    </ul>
</div>
